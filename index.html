<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Courses & Audio Books</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🚀 LearnHub</div>
        <div class="nav-links">
            <button id="btn-coding" onclick="switchTab('coding')" class="nav-btn active">💻 Coding Courses</button>
            <button id="btn-library" onclick="switchTab('library')" class="nav-btn">📚 Audio Books & Reader</button>
        </div>
        <div class="user-stats">
            🏆 Points: <span id="points-display">0</span> PTS
        </div>
    </header>

    <main class="main-container">

        <!-- TAB 1: CODING COURSES -->
        <section id="coding-tab" class="tab-content active">
            <h2>Select a Programming Track</h2>
            <div id="lang-buttons" class="button-bar"></div>
            
            <div class="course-grid">
                <div class="video-container">
                    <iframe id="video-player" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    <div class="timer-box">
                        <span id="timer-status">⏱ Select a lesson to start watch timer</span>
                        <button id="claim-btn" onclick="claimLessonPoints()" disabled>Claim +20 PTS</button>
                    </div>
                </div>
                <div class="playlist-box">
                    <h3>Course Lessons</h3>
                    <div id="lesson-list"></div>
                </div>
            </div>
        </section>

        <!-- TAB 2: AUDIO BOOKS & READER -->
        <section id="library-tab" class="tab-content">
            <h2>Public Domain Audiobooks & Text Reader</h2>
            <div id="books-grid" class="books-grid"></div>

            <!-- Book Reader View -->
            <div id="reader-view" class="reader-card hidden">
                <div class="reader-header">
                    <h3 id="current-book-title">Select a Book</h3>
                    <button onclick="closeReader()" class="close-btn">✖ Close Reader</button>
                </div>
                <audio id="audio-player" controls class="audio-element"></audio>
                <div class="text-controls">
                    <button onclick="loadBookPages()" class="action-btn">📖 Fetch Pages from Gutenberg API</button>
                </div>
                <div id="book-pages" class="pages-display">Click the button above to load book pages...</div>
            </div>
        </section>

    </main>

    <!-- Single JavaScript File -->
    <script src="./app.js"></script>
</body>
</html>
